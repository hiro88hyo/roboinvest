# CI テスト用スタック: Postgres + Pub/Sub エミュレータのみ
#
# Supabase CLI は CI で動かすと重いため、生の Postgres に contracts/sql のマイグレーションを
# `docker-entrypoint-initdb.d` 経由で初回起動時に適用する。
#
# 使い方: `docker compose -f infra/docker-compose.test.yml up -d`

name: trade-ai-test

services:
  postgres:
    image: postgres:16-alpine
    container_name: trade-ai-test-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trade_ai
    ports:
      - "54322:5432"
    volumes:
      # 初回起動時にアルファベット順で実行される。001_ → 009_ の順で適用。
      - ../contracts/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trade_ai"]
      interval: 2s
      timeout: 2s
      retries: 20

  pubsub:
    # :slim には JRE が含まれず Pub/Sub エミュレータが起動できないため :emulators を使用
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:emulators
    container_name: trade-ai-test-pubsub
    command:
      - gcloud
      - beta
      - emulators
      - pubsub
      - start
      - --host-port=0.0.0.0:8085
      - --project=trade-ai-test
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8085/ || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 20

  pubsub-init:
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    container_name: trade-ai-test-pubsub-init
    depends_on:
      pubsub:
        condition: service_healthy
    environment:
      PUBSUB_EMULATOR_HOST: pubsub:8085
      PUBSUB_PROJECT_ID: trade-ai-test
    volumes:
      - ./pubsub:/pubsub:ro
    entrypoint: ["/bin/sh", "/pubsub/init-topics.sh"]
    restart: "no"
