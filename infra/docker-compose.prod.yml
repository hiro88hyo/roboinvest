name: trade-ai-prod

x-common-env: &common-env
  TZ: ${TZ:-Asia/Tokyo}
  APP_ENV: ${APP_ENV:-production}
  JSON_LOGS: ${JSON_LOGS:-true}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  MARKET_DATA_STALE_WARN_SECONDS: ${MARKET_DATA_STALE_WARN_SECONDS:-180}
  SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
  SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?SUPABASE_SECRET_KEY is required}
  PUBSUB_PROJECT_ID: ${PUBSUB_PROJECT_ID:?PUBSUB_PROJECT_ID is required}
  GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/run/secrets/gcp-pubsub-sa.json}

x-python-service: &python-service
  restart: unless-stopped
  environment:
    <<: *common-env
  volumes:
    - trade-ai-logs:/app/logs
    - ${GOOGLE_APPLICATION_CREDENTIALS_HOST_PATH:-/dev/shm/roboinvest/gcp-pubsub-sa.json}:/run/secrets/gcp-pubsub-sa.json:ro

x-stream-service: &stream-service
  <<: *python-service
  command: ["stream"]

services:
  universe-scanner:
    <<: *python-service
    profiles: ["batch"]
    restart: "no"
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        SERVICE_PATH: services/universe-scanner
        PACKAGE_NAME: universe-scanner
        MODULE_NAME: universe_scanner
    command: []
    environment:
      <<: *common-env
      JQUANTS_API_VERSION: ${JQUANTS_API_VERSION:-v2}
      JQUANTS_API_KEY: ${JQUANTS_API_KEY:-}
      JQUANTS_REFRESH_TOKEN: ${JQUANTS_REFRESH_TOKEN:-}
      JQUANTS_PLAN: ${JQUANTS_PLAN:-standard}
      JQUANTS_API_BASE: ${JQUANTS_API_BASE:-https://api.jquants.com/v2}
      MARKET_REGIME_ENABLED: ${MARKET_REGIME_ENABLED:-true}
      MARKET_REGIME_WRITE_ENABLED: ${MARKET_REGIME_WRITE_ENABLED:-false}

  feeder:
    <<: *stream-service
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        SERVICE_PATH: services/feeder
        PACKAGE_NAME: feeder
        MODULE_NAME: feeder
    environment:
      <<: *common-env
      KABU_API_BASE_URL: ${KABU_API_BASE_URL:?KABU_API_BASE_URL is required}
      KABU_WS_URL: ${KABU_WS_URL:?KABU_WS_URL is required}
      KABU_API_PASSWORD: ${KABU_API_PASSWORD:?KABU_API_PASSWORD is required}
      KABU_DEFAULT_EXCHANGE: ${FEEDER_KABU_DEFAULT_EXCHANGE:-1}
      KABU_TOKEN_CACHE_FILE: /var/lib/kabu/token_cache.json
      PUBSUB_TOPIC_RAW_MARKET_DATA: ${PUBSUB_TOPIC_RAW_MARKET_DATA:-raw-market-data}
    volumes:
      - trade-ai-logs:/app/logs
      - kabu-token-cache:/var/lib/kabu
      - ${GOOGLE_APPLICATION_CREDENTIALS_HOST_PATH:-/dev/shm/roboinvest/gcp-pubsub-sa.json}:/run/secrets/gcp-pubsub-sa.json:ro

  feature-engine:
    <<: *stream-service
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        SERVICE_PATH: services/feature-engine
        PACKAGE_NAME: feature-engine
        MODULE_NAME: feature_engine
    environment:
      <<: *common-env
      STORAGE_TICK_RESOLUTION: ${STORAGE_TICK_RESOLUTION:-1s}
      STORAGE_WARM_DIR: /data/warm
      STORAGE_COLD_DIR: /data/cold
      STORAGE_BOOK_DIR: /data/books
      STORAGE_FEATURE_DIR: /data/features
      MAX_HOLD_MINUTES: ${MAX_HOLD_MINUTES:-45}
    volumes:
      - trade-ai-logs:/app/logs
      - feature-warm-data:/data/warm
      - feature-cold-data:/data/cold
      - feature-book-data:/data/books
      - feature-data:/data/features
      - ${GOOGLE_APPLICATION_CREDENTIALS_HOST_PATH:-/dev/shm/roboinvest/gcp-pubsub-sa.json}:/run/secrets/gcp-pubsub-sa.json:ro

  strategy-rule:
    <<: *stream-service
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        SERVICE_PATH: services/strategy-rule
        PACKAGE_NAME: strategy-rule
        MODULE_NAME: strategy_rule
    environment:
      <<: *common-env
      PUBSUB_SUBSCRIPTION_FEATURES: ${PUBSUB_SUBSCRIPTION_RULE_FEATURES:-strategy-rule-processed-features}
      PUBSUB_TOPIC_SIGNALS: ${PUBSUB_TOPIC_SIGNALS_A:-strategy-signals-a}
      PUBSUB_TOPIC_AI_TRIGGERS: ${PUBSUB_TOPIC_AI_TRIGGERS:-strategy-ai-triggers}
      AI_TRIGGER_MIN_CONFIDENCE: ${AI_TRIGGER_MIN_CONFIDENCE:-0.8}
      STRATEGIES_ENABLED: ${STRATEGIES_ENABLED:-rsi_threshold,bollinger_breakout}
      SMA_MIN_GAP_RATIO: ${SMA_MIN_GAP_RATIO:-0.005}
      RSI_BUY_THRESHOLD: ${RSI_BUY_THRESHOLD:-25.0}
      RSI_SELL_THRESHOLD: ${RSI_SELL_THRESHOLD:-75.0}
      BOLLINGER_BREAKOUT_TOLERANCE: ${BOLLINGER_BREAKOUT_TOLERANCE:-0.15}
      ENTRY_VOLUME_RATIO_MIN: ${ENTRY_VOLUME_RATIO_MIN:-}

  strategy-ai:
    <<: *stream-service
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        SERVICE_PATH: services/strategy-ai
        PACKAGE_NAME: strategy-ai
        MODULE_NAME: strategy_ai
    environment:
      <<: *common-env
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      AI_MIN_INTERVAL_SECONDS: ${AI_MIN_INTERVAL_SECONDS:-300}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-2048}
      PUBSUB_PULL_MAX_MESSAGES: ${AI_PUBSUB_PULL_MAX_MESSAGES:-5}
      PUBSUB_SUBSCRIPTION_FEATURES: ${PUBSUB_SUBSCRIPTION_AI_FEATURES:-strategy-ai-rule-signals}
      PUBSUB_TOPIC_SIGNALS: ${PUBSUB_TOPIC_SIGNALS_B:-strategy-signals-b}

  aggregator:
    <<: *stream-service
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        SERVICE_PATH: services/aggregator
        PACKAGE_NAME: aggregator
        MODULE_NAME: aggregator
    environment:
      <<: *common-env
      PUBSUB_SUBSCRIPTION_SIGNALS_A: ${PUBSUB_SUBSCRIPTION_SIGNALS_A:-aggregator-strategy-signals-a}
      PUBSUB_SUBSCRIPTION_SIGNALS_B: ${PUBSUB_SUBSCRIPTION_SIGNALS_B:-aggregator-strategy-signals-b}
      PUBSUB_TOPIC_TRADE_SIGNALS: ${PUBSUB_TOPIC_TRADE_SIGNALS:-trade-signals}
      SOURCE_WEIGHT_RULE: ${SOURCE_WEIGHT_RULE:-1.0}
      SOURCE_WEIGHT_AI: ${SOURCE_WEIGHT_AI:-1.0}
      CONSENSUS_MIN_CONFIDENCE: ${CONSENSUS_MIN_CONFIDENCE:-0.3}
      MIN_CONFIDENCE_RULE_ONLY: ${MIN_CONFIDENCE_RULE_ONLY:-0.5}
      MIN_CONFIDENCE_AI_ONLY: ${MIN_CONFIDENCE_AI_ONLY:-0.5}
      MIN_CONFIDENCE_CONSENSUS: ${MIN_CONFIDENCE_CONSENSUS:-0.3}
      CONFLICT_POLICY: ${CONFLICT_POLICY:-skip}

  gateway:
    <<: *stream-service
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        SERVICE_PATH: services/gateway
        PACKAGE_NAME: gateway
        MODULE_NAME: gateway
    environment:
      <<: *common-env
      TRADE_MODE: ${TRADE_MODE:-paper}
      PUBSUB_SUBSCRIPTION_TRADE_SIGNALS: ${PUBSUB_SUBSCRIPTION_TRADE_SIGNALS:-gateway-trade-signals}
      PUBSUB_TOPIC_LIVE_ORDERS: ${PUBSUB_TOPIC_LIVE_ORDERS:-live-orders}
      PUBSUB_TOPIC_PAPER_ORDERS: ${PUBSUB_TOPIC_PAPER_ORDERS:-paper-orders}
      KABU_API_BASE_URL: ${KABU_API_BASE_URL:?KABU_API_BASE_URL is required}
      KABU_API_PASSWORD: ${KABU_API_PASSWORD:?KABU_API_PASSWORD is required}
      KABU_TOKEN_CACHE_FILE: /var/lib/kabu/token_cache.json
      CAPITAL: ${CAPITAL:-1000000}
      MAX_RISK_PER_TRADE_PCT: ${MAX_RISK_PER_TRADE_PCT:-0.02}
      SWING_RISK_SCALE: ${SWING_RISK_SCALE:-0.5}
      DEFAULT_STOP_LOSS_SPREAD_PCT: ${DEFAULT_STOP_LOSS_SPREAD_PCT:-0.02}
      MIN_LOT_SIZE: ${MIN_LOT_SIZE:-100}
      OMS_LIVE_MAX_QTY_PER_ORDER: ${OMS_LIVE_MAX_QTY_PER_ORDER:-}
      DAY_SAME_SYMBOL_REENTRY_BLOCK_ENABLED: ${DAY_SAME_SYMBOL_REENTRY_BLOCK_ENABLED:-true}
      MARKET_REGIME_GATEWAY_LOG_ONLY_ENABLED: ${MARKET_REGIME_GATEWAY_LOG_ONLY_ENABLED:-true}
      MARKET_REGIME_GATEWAY_GUARD_ENABLED: ${MARKET_REGIME_GATEWAY_GUARD_ENABLED:-false}
      MARKET_REGIME_PAPER_GUARD_ENABLED: ${MARKET_REGIME_PAPER_GUARD_ENABLED:-false}
      SOFT_LOSS_THROTTLE_LOG_ONLY_ENABLED: ${SOFT_LOSS_THROTTLE_LOG_ONLY_ENABLED:-true}
      SOFT_LOSS_THROTTLE_GUARD_ENABLED: ${SOFT_LOSS_THROTTLE_GUARD_ENABLED:-false}
      SOFT_LOSS_LIMIT_JPY: ${SOFT_LOSS_LIMIT_JPY:-20000}
      EXECUTION_GATE_LOG_ONLY_ENABLED: ${EXECUTION_GATE_LOG_ONLY_ENABLED:-true}
      EXECUTION_GATE_GUARD_ENABLED: ${EXECUTION_GATE_GUARD_ENABLED:-false}
      EXECUTION_GATE_MAX_SPREAD_BPS: ${EXECUTION_GATE_MAX_SPREAD_BPS:-30}
      EXECUTION_GATE_MAX_SPREAD_TICKS: ${EXECUTION_GATE_MAX_SPREAD_TICKS:-2}
      EXECUTION_GATE_MIN_ASK_DEPTH_MULTIPLIER: ${EXECUTION_GATE_MIN_ASK_DEPTH_MULTIPLIER:-3}
      LIVE_DAY_NEW_BUY_START_TIME: ${LIVE_DAY_NEW_BUY_START_TIME:-09:15}
      LIVE_DAY_NEW_BUY_CUTOFF_TIME: ${LIVE_DAY_NEW_BUY_CUTOFF_TIME:-14:30}
      ORDER_ARCHIVE_DIR: /data/orders
    volumes:
      - trade-ai-logs:/app/logs
      - gateway-order-data:/data/orders
      - kabu-token-cache:/var/lib/kabu
      - ${GOOGLE_APPLICATION_CREDENTIALS_HOST_PATH:-/dev/shm/roboinvest/gcp-pubsub-sa.json}:/run/secrets/gcp-pubsub-sa.json:ro

  oms-live:
    <<: *stream-service
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        SERVICE_PATH: services/oms-live
        PACKAGE_NAME: oms-live
        MODULE_NAME: oms_live
    environment:
      <<: *common-env
      KABU_API_BASE_URL: ${KABU_API_BASE_URL:?KABU_API_BASE_URL is required}
      KABU_API_PASSWORD: ${KABU_API_PASSWORD:?KABU_API_PASSWORD is required}
      KABU_ORDER_PASSWORD: ${KABU_ORDER_PASSWORD:?KABU_ORDER_PASSWORD is required}
      KABU_DEFAULT_EXCHANGE: ${KABU_DEFAULT_EXCHANGE:-9}
      KABU_ACCOUNT_TYPE: ${KABU_ACCOUNT_TYPE:-4}
      KABU_TOKEN_CACHE_FILE: /var/lib/kabu/token_cache.json
      PUBSUB_SUBSCRIPTION_LIVE_ORDERS: ${PUBSUB_SUBSCRIPTION_LIVE_ORDERS:-oms-live-live-orders}
      DAY_CLOSEOUT_TIME: ${DAY_CLOSEOUT_TIME:-14:50}
      DAY_CLOSEOUT_TIMEZONE: ${DAY_CLOSEOUT_TIMEZONE:-Asia/Tokyo}
      CLOSEOUT_ORDER_FILL_TIMEOUT_SECONDS: ${CLOSEOUT_ORDER_FILL_TIMEOUT_SECONDS:-2400}
      OMS_LIVE_DRY_RUN: ${OMS_LIVE_DRY_RUN:-true}
      OMS_LIVE_MAX_QTY_PER_ORDER: ${OMS_LIVE_MAX_QTY_PER_ORDER:?OMS_LIVE_MAX_QTY_PER_ORDER is required}
      OMS_LIVE_ALLOWED_SYMBOLS: ${OMS_LIVE_ALLOWED_SYMBOLS:?OMS_LIVE_ALLOWED_SYMBOLS is required}
    volumes:
      - trade-ai-logs:/app/logs
      - kabu-token-cache:/var/lib/kabu
      - ${GOOGLE_APPLICATION_CREDENTIALS_HOST_PATH:-/dev/shm/roboinvest/gcp-pubsub-sa.json}:/run/secrets/gcp-pubsub-sa.json:ro

  oms-paper:
    <<: *stream-service
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        SERVICE_PATH: services/oms-paper
        PACKAGE_NAME: oms-paper
        MODULE_NAME: oms_paper
    environment:
      <<: *common-env
      PUBSUB_SUBSCRIPTION_PAPER_ORDERS: ${PUBSUB_SUBSCRIPTION_PAPER_ORDERS:-oms-paper-paper-orders}
      PUBSUB_SUBSCRIPTION_RAW_MARKET_DATA: ${PUBSUB_SUBSCRIPTION_RAW_MARKET_DATA:-oms-paper-raw-market-data}
      DAY_CLOSEOUT_TIME: ${DAY_CLOSEOUT_TIME:-14:50}
      DAY_CLOSEOUT_TIMEZONE: ${DAY_CLOSEOUT_TIMEZONE:-Asia/Tokyo}

  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.153.0}
    profiles: ["observability"]
    restart: unless-stopped
    user: "0:0"
    command: ["--config=/etc/otelcol/config.yml"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/run/secrets/gcp-pubsub-sa.json}
      GOOGLE_CLOUD_PROJECT: ${PUBSUB_PROJECT_ID:?PUBSUB_PROJECT_ID is required}
    volumes:
      - ./otel-collector/config.yml:/etc/otelcol/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - otel-collector-state:/var/lib/otelcol
      - ${GOOGLE_APPLICATION_CREDENTIALS_HOST_PATH:-/dev/shm/roboinvest/gcp-pubsub-sa.json}:/run/secrets/gcp-pubsub-sa.json:ro
    ports:
      - "127.0.0.1:13133:13133"

volumes:
  kabu-token-cache:
  feature-book-data:
  feature-data:
  feature-warm-data:
  feature-cold-data:
  gateway-order-data:
  trade-ai-logs:
  otel-collector-state:
