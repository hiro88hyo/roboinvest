receivers:
  file_log/fixture:
    include:
      - /fixtures/docker-json.log
    start_at: beginning
    include_file_path: true
    include_file_name: false
    operators:
      - id: parse_docker_json
        type: json_parser
        parse_from: body
        parse_to: attributes.docker
        timestamp:
          parse_from: attributes.docker.time
          layout_type: gotime
          layout: "2006-01-02T15:04:05.999999999Z07:00"
      - id: move_docker_log_to_body
        type: move
        from: attributes.docker.log
        to: body
      - id: move_docker_stream
        type: move
        from: attributes.docker.stream
        to: attributes.docker_stream
      - id: drop_non_json_body
        type: filter
        expr: 'body matches "^\\s*\\{" == false'
      - id: drop_non_app_json_body
        type: filter
        expr: 'body matches "\\\"timestamp\\\"\\s*:" == false or body matches "\\\"service\\\"\\s*:" == false or body matches "\\\"event\\\"\\s*:" == false'
      - id: parse_app_json
        type: json_parser
        parse_from: body
        parse_to: body
        on_error: send
        timestamp:
          parse_from: body.timestamp
          layout_type: gotime
          layout: "2006-01-02T15:04:05.999999Z07:00"
        severity:
          parse_from: body.severity
      - id: cleanup_docker_envelope
        type: remove
        field: attributes.docker

processors:
  batch:
    timeout: 1s
    send_batch_size: 10
    send_batch_max_size: 10
  resource/roboinvest:
    attributes:
      - key: service.namespace
        value: roboinvest
        action: upsert
      - key: deployment.environment
        value: parse-fixture
        action: upsert
  filter/roboinvest_app_json:
    error_mode: ignore
    logs:
      log_record:
        - 'body["service"] == nil or body["event"] == nil'

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    logs:
      receivers:
        - file_log/fixture
      processors:
        - filter/roboinvest_app_json
        - resource/roboinvest
        - batch
      exporters:
        - debug
  telemetry:
    logs:
      level: info
