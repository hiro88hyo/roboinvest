version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"
    # Workspace members are local packages. Never replace them with
    # unrelated packages that happen to use the same name on PyPI.
    ignore:
      - dependency-name: "trade-contracts"
      - dependency-name: "universe-scanner"
      - dependency-name: "feature-engine"
      - dependency-name: "strategy-rule"
      - dependency-name: "strategy-ai"
      - dependency-name: "aggregator"
      - dependency-name: "gateway"
      - dependency-name: "oms-paper"
      - dependency-name: "oms-live"
      - dependency-name: "feeder"
      - dependency-name: "opportunity-router"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "python"

  - package-ecosystem: "npm"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "dashboard"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "ci"
