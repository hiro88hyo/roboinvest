name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.5.x"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Verify Supabase deployment SQL artifacts
        run: uv run python scripts/check-supabase-migration-contracts.py

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: ruff check
        run: uv run ruff check .

      - name: mypy --strict
        run: uv run mypy

      - name: pytest
        run: uv run pytest -m "not integration" --cov --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html:htmlcov

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn
          retention-days: 14

  dashboard:
    name: Dashboard lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 24.15.0
        uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: npm ci
        run: npm ci

      - name: biome check
        run: npm run lint

      - name: tsc --noEmit
        run: npm run typecheck

      - name: vitest
        run: npm test

  oms-paper-rpc:
    name: Event transport stress safety (Supabase + Pub/Sub)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBSUB_EMULATOR_HOST: localhost:8085
      PUBSUB_PROJECT_ID: trade-ai-dev
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.5.x"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Start Pub/Sub emulator + init topics
        run: docker compose -f infra/docker-compose.dev.yml up -d pubsub pubsub-init

      - name: Wait for Pub/Sub topics initialised
        run: |
          for _ in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Status}}' trade-ai-pubsub-init 2>/dev/null || echo "")
            if [ "$status" = "exited" ]; then
              code=$(docker inspect -f '{{.State.ExitCode}}' trade-ai-pubsub-init)
              if [ "$code" = "0" ]; then
                echo "Pub/Sub topics ready"
                exit 0
              fi
              echo "init-topics failed (exit=$code)"
              docker logs trade-ai-pubsub-init || true
              exit 1
            fi
            sleep 2
          done
          echo "init-topics did not finish within 120s"
          docker logs trade-ai-pubsub-init || true
          exit 1

      - name: Start Supabase local stack
        working-directory: infra
        run: supabase start

      - name: Apply contract SQL and reload PostgREST
        run: |
          cat contracts/sql/*.sql infra/supabase/seed.sql \
            | docker exec -i supabase_db_trade-ai-agent \
                psql -U postgres -d postgres -v ON_ERROR_STOP=1
          docker exec supabase_db_trade-ai-agent \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "notify pgrst, 'reload schema';"

      - name: Verify event-paper and OMS Paper RPC security
        run: |
          docker exec -i supabase_db_trade-ai-agent \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
              function_signature text;
              function_oid oid;
              function_is_security_definer boolean;
              function_config text[];
          begin
              foreach function_signature in array array[
                  'public.event_paper_cas_strategy_reasoning(uuid,text,text)',
                  'public.event_paper_stage_dispatch(text,text,uuid,jsonb,text,jsonb,text,text,text,text,timestamptz,text)',
                  'public.oms_paper_apply_fill(uuid,uuid,text,text,integer,numeric,text,uuid,timestamptz,timestamptz,text,numeric,numeric,integer,date,numeric)'
              ] loop
                  function_oid := function_signature::regprocedure;
                  if has_function_privilege('anon', function_signature, 'EXECUTE') then
                      raise exception 'anon may execute %', function_signature;
                  end if;
                  if has_function_privilege('authenticated', function_signature, 'EXECUTE') then
                      raise exception 'authenticated may execute %', function_signature;
                  end if;
                  if not has_function_privilege('service_role', function_signature, 'EXECUTE') then
                      raise exception 'service_role cannot execute %', function_signature;
                  end if;

                  select prosecdef, coalesce(proconfig, array[]::text[])
                  into function_is_security_definer, function_config
                  from pg_proc
                  where oid = function_oid;
                  if not found then
                      raise exception 'event-paper RPC is missing: %', function_signature;
                  end if;
                  if function_is_security_definer then
                      raise exception 'event-paper RPC must be security invoker: %', function_signature;
                  end if;
                  if not ('search_path=""' = any(function_config)) then
                      raise exception 'event-paper RPC must set an empty search_path: %', function_signature;
                  end if;
              end loop;
          end;
          $$;
          SQL

      - name: Export Supabase env
        working-directory: infra
        run: |
          api_url=$(supabase status -o env | sed -n 's/^API_URL=//p' | tr -d '"')
          service_key=$(supabase status -o env | sed -n 's/^SERVICE_ROLE_KEY=//p' | tr -d '"')
          anon_key=$(supabase status -o env | sed -n 's/^ANON_KEY=//p' | tr -d '"')
          if [ -z "$api_url" ] || [ -z "$service_key" ] || [ -z "$anon_key" ]; then
            echo "failed to extract supabase env"
            exit 1
          fi
          echo "SUPABASE_URL=$api_url" >> "$GITHUB_ENV"
          echo "SUPABASE_SECRET_KEY=$service_key" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$anon_key" >> "$GITHUB_ENV"

      - name: Verify Supabase RPC health
        run: uv run scripts/health-check.py --check supabase --timeout 10

      - name: Test atomic fill and generation guards
        run: >-
          uv run pytest -q
          services/oms-paper/tests/integration/test_paper_stream_runner_e2e.py
          -k 'atomic_fill_rpc or stale_position_generation'

      - name: Test event transport stress and scheduled opening exits
        run: >-
          uv run pytest -q
          services/strategy-rule/tests/integration/test_event_paper_pipeline_e2e.py
          services/strategy-rule/tests/integration/test_strategy_rule_event_paper_rpc_security.py

      - name: Dump Pub/Sub emulator logs on failure
        if: failure()
        run: docker logs trade-ai-pubsub || true

      - name: Dump Supabase services on failure
        if: failure()
        working-directory: infra
        run: |
          supabase status || true
          docker ps -a --filter "name=supabase" || true

  e2e:
    name: Integration tests (Pub/Sub + Supabase)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBSUB_EMULATOR_HOST: localhost:8085
      PUBSUB_PROJECT_ID: trade-ai-dev
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.5.x"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Start Pub/Sub emulator + init topics
        run: docker compose -f infra/docker-compose.dev.yml up -d pubsub pubsub-init

      - name: Wait for Pub/Sub topics initialised
        run: |
          for _ in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Status}}' trade-ai-pubsub-init 2>/dev/null || echo "")
            if [ "$status" = "exited" ]; then
              code=$(docker inspect -f '{{.State.ExitCode}}' trade-ai-pubsub-init)
              if [ "$code" = "0" ]; then
                echo "Pub/Sub topics ready"
                exit 0
              fi
              echo "init-topics failed (exit=$code)"
              docker logs trade-ai-pubsub-init || true
              exit 1
            fi
            sleep 2
          done
          echo "init-topics did not finish within 120s"
          docker logs trade-ai-pubsub-init || true
          exit 1

      - name: Start Supabase local stack
        working-directory: infra
        run: supabase start

      - name: Apply contract SQL to Supabase
        run: |
          cat contracts/sql/*.sql infra/supabase/seed.sql \
            | docker exec -i supabase_db_trade-ai-agent \
                psql -U postgres -d postgres -v ON_ERROR_STOP=1
          docker exec supabase_db_trade-ai-agent \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "notify pgrst, 'reload schema';"

      - name: Export Supabase env
        working-directory: infra
        run: |
          api_url=$(supabase status -o env | sed -n 's/^API_URL=//p' | tr -d '"')
          service_key=$(supabase status -o env | sed -n 's/^SERVICE_ROLE_KEY=//p' | tr -d '"')
          anon_key=$(supabase status -o env | sed -n 's/^ANON_KEY=//p' | tr -d '"')
          if [ -z "$api_url" ] || [ -z "$service_key" ] || [ -z "$anon_key" ]; then
            echo "failed to extract supabase env"
            exit 1
          fi
          echo "SUPABASE_URL=$api_url" >> "$GITHUB_ENV"
          echo "SUPABASE_SECRET_KEY=$service_key" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$anon_key" >> "$GITHUB_ENV"

      - name: pytest -m integration
        run: uv run pytest -m integration -v --durations=20

      - name: Dump Pub/Sub emulator logs on failure
        if: failure()
        run: docker logs trade-ai-pubsub || true

      - name: Dump Supabase services on failure
        if: failure()
        working-directory: infra
        run: |
          supabase status || true
          docker ps -a --filter "name=supabase" || true
