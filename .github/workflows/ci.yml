name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.5.x"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync --all-packages

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: ruff check
        run: uv run ruff check .

      - name: mypy --strict
        run: uv run mypy

      - name: pytest
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html:htmlcov

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn
          retention-days: 14

  dashboard:
    name: Dashboard lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 24.15.0
        uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: npm ci
        run: npm ci

      - name: biome check
        run: npm run lint

      - name: tsc --noEmit
        run: npm run typecheck

      - name: vitest
        run: npm test
