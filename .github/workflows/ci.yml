name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.5.x"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync --all-packages

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: ruff check
        run: uv run ruff check .

      - name: mypy --strict
        run: uv run mypy

      - name: pytest
        run: uv run pytest -m "not integration" --cov --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html:htmlcov

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn
          retention-days: 14

  dashboard:
    name: Dashboard lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 24.15.0
        uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: npm ci
        run: npm ci

      - name: biome check
        run: npm run lint

      - name: tsc --noEmit
        run: npm run typecheck

      - name: vitest
        run: npm test

  e2e:
    name: Integration tests (Pub/Sub + Supabase)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBSUB_EMULATOR_HOST: localhost:8085
      PUBSUB_PROJECT_ID: trade-ai-dev
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.5.x"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Start Pub/Sub emulator + init topics
        run: docker compose -f infra/docker-compose.dev.yml up -d pubsub pubsub-init

      - name: Wait for Pub/Sub topics initialised
        run: |
          for _ in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Status}}' trade-ai-pubsub-init 2>/dev/null || echo "")
            if [ "$status" = "exited" ]; then
              code=$(docker inspect -f '{{.State.ExitCode}}' trade-ai-pubsub-init)
              if [ "$code" = "0" ]; then
                echo "Pub/Sub topics ready"
                exit 0
              fi
              echo "init-topics failed (exit=$code)"
              docker logs trade-ai-pubsub-init || true
              exit 1
            fi
            sleep 2
          done
          echo "init-topics did not finish within 120s"
          docker logs trade-ai-pubsub-init || true
          exit 1

      - name: Start Supabase local stack
        working-directory: infra
        run: supabase start

      - name: Apply contract SQL to Supabase
        run: |
          cat contracts/sql/*.sql infra/supabase/seed.sql \
            | docker exec -i supabase_db_trade-ai-agent \
                psql -U postgres -d postgres -v ON_ERROR_STOP=1
          docker exec supabase_db_trade-ai-agent \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "notify pgrst, 'reload schema';"

      - name: Export Supabase env
        working-directory: infra
        run: |
          api_url=$(supabase status -o env | sed -n 's/^API_URL=//p' | tr -d '"')
          service_key=$(supabase status -o env | sed -n 's/^SERVICE_ROLE_KEY=//p' | tr -d '"')
          if [ -z "$api_url" ] || [ -z "$service_key" ]; then
            echo "failed to extract supabase env"
            supabase status -o env
            exit 1
          fi
          echo "SUPABASE_URL=$api_url" >> "$GITHUB_ENV"
          echo "SUPABASE_SECRET_KEY=$service_key" >> "$GITHUB_ENV"

      - name: pytest -m integration
        run: uv run pytest -m integration -v --durations=20

      - name: Dump Pub/Sub emulator logs on failure
        if: failure()
        run: docker logs trade-ai-pubsub || true

      - name: Dump Supabase services on failure
        if: failure()
        working-directory: infra
        run: |
          supabase status || true
          docker ps -a --filter "name=supabase" || true
