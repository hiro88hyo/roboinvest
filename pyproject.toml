[project]
name = "trade-ai-agent"
version = "0.0.0"
description = "Trade AI Agent workspace root (not a publishable package)"
requires-python = ">=3.12"
# ワークスペースメンバーは root の dependencies 経由で解決する。
dependencies = [
    "trade-contracts",
    "universe-scanner",
    "feature-engine",
]

[tool.uv]
# ワークスペースのルートはメタ構成のみ。パッケージとしては build しない。
package = false

[tool.uv.sources]
trade-contracts = { workspace = true }
universe-scanner = { workspace = true }
feature-engine = { workspace = true }

[tool.uv.workspace]
# 未実装のサービスはディレクトリが生まれたタイミングで追記する。
members = [
    "contracts/python",
    "services/universe-scanner",
    "services/feature-engine",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
]

# --- ruff ------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["infra/supabase/migrations"]

[tool.ruff.lint]
select = [
    "E", "W", # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # flake8-bugbear
    "UP",      # pyupgrade
    "SIM",     # flake8-simplify
    "RUF",     # Ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

# --- mypy ------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "contracts/python:services/universe-scanner/src:services/feature-engine/src"
files = [
    "contracts/python/trade_contracts",
    "contracts/python/tests",
    "services/universe-scanner/src",
    "services/universe-scanner/tests",
    "services/feature-engine/src",
    "services/feature-engine/tests",
]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "jpholiday"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# --- pytest ----------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
addopts = "-ra --strict-markers --import-mode=importlib"
testpaths = [
    "contracts/python/tests",
    "services/universe-scanner/tests",
    "services/feature-engine/tests",
]
markers = [
    "integration: end-to-end tests that require a running Pub/Sub emulator / Supabase (skipped by default if unreachable)",
]

# --- coverage --------------------------------------------------------
[tool.coverage.run]
branch = true
source = [
    "contracts/python/trade_contracts",
    "services/universe-scanner/src/universe_scanner",
    "services/feature-engine/src/feature_engine",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
