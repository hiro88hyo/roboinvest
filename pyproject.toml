[project]
name = "trade-ai-agent"
version = "0.0.0"
description = "Trade AI Agent workspace root (not a publishable package)"
requires-python = ">=3.12"
# ワークスペースメンバーは root の dependencies 経由で解決する。
dependencies = [
    "trade-contracts",
    "universe-scanner",
    "feature-engine",
    "strategy-rule",
    "strategy-ai",
    "aggregator",
    "gateway",
    "oms-paper",
    "oms-live",
    "feeder",
]

[tool.uv]
# ワークスペースのルートはメタ構成のみ。パッケージとしては build しない。
package = false

[tool.uv.sources]
trade-contracts = { workspace = true }
universe-scanner = { workspace = true }
feature-engine = { workspace = true }
strategy-rule = { workspace = true }
strategy-ai = { workspace = true }
aggregator = { workspace = true }
gateway = { workspace = true }
oms-paper = { workspace = true }
oms-live = { workspace = true }
feeder = { workspace = true }

[tool.uv.workspace]
# 未実装のサービスはディレクトリが生まれたタイミングで追記する。
members = [
    "contracts/python",
    "services/universe-scanner",
    "services/feature-engine",
    "services/strategy-rule",
    "services/strategy-ai",
    "services/aggregator",
    "services/gateway",
    "services/oms-paper",
    "services/oms-live",
    "services/feeder",
]

[dependency-groups]
dev = [
    "ruff>=0.15.15",
    "mypy>=2.1.0",
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=5",
]

# --- ruff ------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["infra/supabase/migrations"]

[tool.ruff.lint]
select = [
    "E", "W", # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # flake8-bugbear
    "UP",      # pyupgrade
    "SIM",     # flake8-simplify
    "RUF",     # Ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

# --- mypy ------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "contracts/python:services/universe-scanner/src:services/feature-engine/src:services/strategy-rule/src:services/strategy-ai/src:services/aggregator/src:services/gateway/src:services/oms-paper/src:services/oms-live/src:services/feeder/src"
files = [
    "contracts/python/trade_contracts",
    "contracts/python/tests",
    "services/universe-scanner/src",
    "services/universe-scanner/tests",
    "services/feature-engine/src",
    "services/feature-engine/tests",
    "services/strategy-rule/src",
    "services/strategy-rule/tests",
    "services/strategy-ai/src",
    "services/strategy-ai/tests",
    "services/aggregator/src",
    "services/aggregator/tests",
    "services/gateway/src",
    "services/gateway/tests",
    "services/oms-paper/src",
    "services/oms-paper/tests",
    "services/oms-live/src",
    "services/oms-live/tests",
    "services/feeder/src",
    "services/feeder/tests",
]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "jpholiday"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "google.cloud.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "websockets.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# --- pytest ----------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
addopts = "-ra --strict-markers --import-mode=importlib"
testpaths = [
    "scripts/tests",
    "contracts/python/tests",
    "services/universe-scanner/tests",
    "services/feature-engine/tests",
    "services/strategy-rule/tests",
    "services/strategy-ai/tests",
    "services/aggregator/tests",
    "services/gateway/tests",
    "services/oms-paper/tests",
    "services/oms-live/tests",
    "services/feeder/tests",
]
markers = [
    "integration: end-to-end tests that require a running Pub/Sub emulator / Supabase (skipped by default if unreachable)",
]

# --- coverage --------------------------------------------------------
[tool.coverage.run]
branch = true
source = [
    "contracts/python/trade_contracts",
    "services/universe-scanner/src/universe_scanner",
    "services/feature-engine/src/feature_engine",
    "services/strategy-rule/src/strategy_rule",
    "services/strategy-ai/src/strategy_ai",
    "services/aggregator/src/aggregator",
    "services/gateway/src/gateway",
    "services/oms-paper/src/oms_paper",
    "services/oms-live/src/oms_live",
    "services/feeder/src/feeder",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
