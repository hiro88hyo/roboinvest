[project]
name = "trade-contracts"
version = "0.1.0"
description = "Shared Pydantic models for Trade AI Agent"
requires-python = ">=3.12"
dependencies = [
    "google-cloud-pubsub>=2.39.1",
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trade_contracts"]
