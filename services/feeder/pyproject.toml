[project]
name = "feeder"
version = "0.1.0"
description = "Feeder: kabuステーション WebSocket PUSH -> raw-market-data (TickData / OrderBookSnapshot)"
requires-python = ">=3.12"
dependencies = [
    "trade-contracts",
    "httpx>=0.27",
    "websockets>=13",
    "pydantic>=2.7",
    "pydantic-settings>=2.15.0",
    "tenacity>=9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feeder"]
