[project]
name = "oms-live"
version = "0.1.0"
description = "OMS Live: live-orders -> kabuステーション API -> trades_live / positions / system_status.daily_pnl"
requires-python = ">=3.12"
dependencies = [
    "trade-contracts",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "tenacity>=9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oms_live"]
