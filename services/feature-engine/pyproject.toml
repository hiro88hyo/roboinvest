[project]
name = "feature-engine"
version = "0.1.0"
description = "Feature Engine: compute technical indicators from market data and publish ProcessedFeatures"
requires-python = ">=3.12"
dependencies = [
    "trade-contracts",
    "httpx>=0.27",
    "jpholiday>=0.1.9",
    "polars>=1.43.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "tenacity>=9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feature_engine"]
