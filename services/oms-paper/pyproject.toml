[project]
name = "oms-paper"
version = "0.1.0"
description = "OMS Paper: paper-orders + raw-market-data -> simulated fills (trades_paper / positions)"
requires-python = ">=3.12"
dependencies = [
    "trade-contracts",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "tenacity>=9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oms_paper"]
