[project]
name = "aggregator"
version = "0.1.0"
description = "Signal Aggregator: consensus over StrategySignal(a|b) -> UnifiedTradeSignal"
requires-python = ">=3.12"
dependencies = [
    "trade-contracts",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "tenacity>=9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aggregator"]
