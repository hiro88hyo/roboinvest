[project]
name = "universe-scanner"
version = "0.1.0"
description = "Daily batch: build watchlist from J-Quants data and persist to Supabase"
requires-python = ">=3.12"
dependencies = [
    "trade-contracts",
    "httpx>=0.27",
    "polars>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "tenacity>=9.0",
    "jpholiday>=0.1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/universe_scanner"]
