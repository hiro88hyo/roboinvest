[project]
name = "strategy-ai"
version = "0.1.0"
description = "Strategy Engine B: LLM-based signal generator over ProcessedFeatures"
requires-python = ">=3.12"
dependencies = [
    "trade-contracts",
    "google-genai>=2.11.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.14.2",
    "tenacity>=9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strategy_ai"]
